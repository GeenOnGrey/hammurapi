# Переиспользуемая выкатка Hammurapi (FTR.HMR.INFRA-0002, техспека п. 2): вызывается
# release.yml репозиториев hammurapi-core и hammurapi-web.
#   uses: GreenOnGrey/hammurapi/.github/workflows/deploy-component.yml@<DEPLOY_WORKFLOW_REF>
#
# Лежит в публичном hammurapi: workflow приватного репозитория (hammurapi-infra) нельзя
# вызвать из публичных core и web. Вся логика — в шагах ниже, без чтения других файлов;
# на машине выполняется bin/hammurapi-deploy из развёрнутой версии стенда
# (/opt/hammurapi-infra/current). Секретов в файле нет — их передаёт вызывающий репозиторий.
# Секреты передаются на машину только в stdin SSH-сессии (R14).
name: deploy-component
on:
  workflow_call:
    inputs:
      component: { type: string, required: true }            # hammurapi-core | hammurapi-web
      tag: { type: string, required: true }                  # vX.Y.Z
      run_id: { type: string, default: "" }                  # контракт FTR.HMR.CMN-0002
      callback_url: { type: string, default: "" }            # контракт FTR.HMR.CMN-0002
      environment: { type: string, default: production }
      verify_signature: { type: boolean, default: false }    # выкатка без пересборки: cosign verify
      allow_key_rotation: { type: boolean, default: false }

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    concurrency: { group: "deploy-${{ inputs.component }}", cancel-in-progress: false }
    permissions: { contents: read, packages: read, id-token: write }
    timeout-minutes: 45
    env:
      COMPONENT: ${{ inputs.component }}
      TAG: ${{ inputs.tag }}
      RUN_ID: ${{ inputs.run_id }}
      CALLBACK_URL: ${{ inputs.callback_url }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_TRANSPORT: ${{ vars.DEPLOY_TRANSPORT || 'ssh' }}
      PROD_DIR: /opt/hammurapi-infra
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CALLBACK_SECRET: ${{ secrets.HAMMURAPI_DEPLOY_CALLBACK_SECRET }}
    steps:
      - name: Общие функции
        run: |
          cat >"$RUNNER_TEMP/hmr.sh" <<'EOF'
          # send_callback <started|success|failure> [ошибка] — вебхук результата
          # по контракту FTR.HMR.CMN-0002: HMAC-SHA256 тела, заголовки X-Hammurapi-*.
          send_callback() {
            [[ -n $CALLBACK_URL ]] || return 0
            local status=$1 err=${2:-} body ts sig i
            body=$(jq -cn --arg r "$RUN_ID" --arg s "$COMPONENT" --arg e "$DEPLOY_ENVIRONMENT" --arg ref "$TAG" \
              --arg st "$status" --arg u "$RUN_URL" --arg err "$err" \
              '{runId: $r, service: $s, environment: $e, ref: $ref, status: $st, runUrl: $u} + (if $err != "" then {error: $err} else {} end)')
            for i in 1 2 3; do
              ts=$(date +%s)
              sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | sed 's/^.* //')
              if curl -fsS --max-time 15 -X POST "$CALLBACK_URL" -H 'Content-Type: application/json' \
                  -H "X-Hammurapi-Timestamp: $ts" -H "X-Hammurapi-Signature: sha256=$sig" --data "$body" >/dev/null; then
                echo "вебхук результата: $status"
                return 0
              fi
              ((i < 3)) && sleep 10
            done
            echo "::warning::вебхук результата «$status» не доставлен на $CALLBACK_URL после 3 попыток"
            echo "- ⚠️ вебхук результата «$status» не доставлен" >>"$GITHUB_STEP_SUMMARY"
          }
          # remote <команда> — команда на машине стенда (ssh | gcp-iap); stdin передаётся.
          remote() {
            case $DEPLOY_TRANSPORT in
              ssh) ssh -F "$HOME/.ssh/config" prod -- "$1" ;;
              gcp-iap) gcloud compute ssh "$GCP_INSTANCE" --project "$GCP_PROJECT" --zone "$GCP_ZONE" \
                  --tunnel-through-iap --quiet --command "$1" ;;
              *) echo "::error::DEPLOY_TRANSPORT должен быть ssh или gcp-iap"; return 1 ;;
            esac
          }
          EOF

      - name: Вебхук started
        if: inputs.callback_url != ''
        run: |
          source "$RUNNER_TEMP/hmr.sh"
          send_callback started

      - name: Параметры
        id: params
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          [[ $COMPONENT == hammurapi-core || $COMPONENT == hammurapi-web ]] || { echo "::error::component: hammurapi-core или hammurapi-web"; exit 1; }
          [[ $INPUT_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::тег «$INPUT_TAG» не в формате vX.Y.Z"; exit 1; }
          [[ $DEPLOY_ENVIRONMENT == production ]] || { echo "::error::демо-стенд — только окружение production, а не «$DEPLOY_ENVIRONMENT»"; exit 1; }
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$COMPONENT" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "refs/tags/${{ inputs.tag }}" }

      - name: Проверка конфигурации (до подключения к машине)
        id: config
        env:
          HAMMURAPI_GITHUB_APP_ID: ${{ vars.HAMMURAPI_GITHUB_APP_ID }}
          HAMMURAPI_GITHUB_CLIENT_ID: ${{ vars.HAMMURAPI_GITHUB_CLIENT_ID }}
          HAMMURAPI_SPEC_REPO: ${{ vars.HAMMURAPI_SPEC_REPO }}
          HAMMURAPI_BOOTSTRAP_ADMINS: ${{ vars.HAMMURAPI_BOOTSTRAP_ADMINS }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          HAS_PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY != '' }}
          HAS_PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS != '' }}
          HAS_HAMMURAPI_GITHUB_APP_PRIVATE_KEY: ${{ secrets.HAMMURAPI_GITHUB_APP_PRIVATE_KEY != '' }}
          HAS_HAMMURAPI_GITHUB_CLIENT_SECRET: ${{ secrets.HAMMURAPI_GITHUB_CLIENT_SECRET != '' }}
          HAS_HAMMURAPI_WEBHOOK_SECRET: ${{ secrets.HAMMURAPI_WEBHOOK_SECRET != '' }}
          HAS_HAMMURAPI_TOKEN_ENCRYPTION_KEY: ${{ secrets.HAMMURAPI_TOKEN_ENCRYPTION_KEY != '' }}
          HAS_HAMMURAPI_GHCR_PULL_TOKEN: ${{ secrets.HAMMURAPI_GHCR_PULL_TOKEN != '' }}
          HAS_HAMMURAPI_DEPLOY_CALLBACK_SECRET: ${{ secrets.HAMMURAPI_DEPLOY_CALLBACK_SECRET != '' }}
        run: |
          missing=()
          need_var() { local k; for k in "$@"; do [[ -n ${!k:-} ]] || missing+=("$k (переменная)"); done; }
          need_secret() { local k h; for k in "$@"; do h="HAS_$k"; [[ ${!h:-false} == true ]] || missing+=("$k (секрет)"); done; }
          case $DEPLOY_TRANSPORT in
            ssh) need_var PROD_HOST PROD_USER; need_secret PROD_SSH_KEY PROD_KNOWN_HOSTS ;;
            gcp-iap) need_var GCP_PROJECT GCP_ZONE GCP_INSTANCE GCP_WIF_PROVIDER GCP_SERVICE_ACCOUNT ;;
            *) missing+=("DEPLOY_TRANSPORT (ssh | gcp-iap)") ;;
          esac
          need_secret HAMMURAPI_GHCR_PULL_TOKEN
          if [[ $COMPONENT == hammurapi-core ]]; then
            need_var HAMMURAPI_GITHUB_APP_ID HAMMURAPI_GITHUB_CLIENT_ID HAMMURAPI_SPEC_REPO HAMMURAPI_BOOTSTRAP_ADMINS
            need_secret HAMMURAPI_GITHUB_APP_PRIVATE_KEY HAMMURAPI_GITHUB_CLIENT_SECRET HAMMURAPI_WEBHOOK_SECRET \
              HAMMURAPI_TOKEN_ENCRYPTION_KEY
          fi
          [[ -n $CALLBACK_URL ]] && need_secret HAMMURAPI_DEPLOY_CALLBACK_SECRET
          if ((${#missing[@]})); then
            printf -v list '%s, ' "${missing[@]}"
            echo "::error::не заданы переменные и секреты организации: ${list%, }"
            echo "error=не заданы: ${list%, }" >>"$GITHUB_OUTPUT"
            exit 1
          fi
          chart=$(sed -n 's/^CHART_VERSION=//p' deploy/versions.env)
          [[ $chart =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::deploy/versions.env: нет CHART_VERSION"; exit 1; }
          echo "chart=$chart" >>"$GITHUB_OUTPUT"
          echo "Выкатка $COMPONENT $TAG, чарт $chart, транспорт $DEPLOY_TRANSPORT"

      - name: Подпись образа
        if: inputs.verify_signature
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: cosign verify (образ собран release.yml этого репозитория)
        if: inputs.verify_signature
        env:
          IMAGE: ${{ steps.params.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          cosign verify "$IMAGE:$TAG" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null \
            || { echo "::error::у $IMAGE:$TAG нет подписи release.yml этого репозитория — выкатка остановлена"; exit 1; }
          echo "подпись $IMAGE:$TAG проверена"

      - name: Доступ к машине (ssh)
        if: env.DEPLOY_TRANSPORT == 'ssh'
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh && umask 077
          printf '%s\n' "$PROD_SSH_KEY" | tr -d '\r' >~/.ssh/deploy_key
          printf '%s\n' "$PROD_KNOWN_HOSTS" | tr -d '\r' >~/.ssh/deploy_known_hosts
          # Проверка ключа хоста не отключается.
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  UserKnownHostsFile ~/.ssh/deploy_known_hosts\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' \
            "$PROD_HOST" "$PROD_USER" >~/.ssh/config
      - name: Доступ к машине (gcp-iap)
        if: env.DEPLOY_TRANSPORT == 'gcp-iap'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - if: env.DEPLOY_TRANSPORT == 'gcp-iap'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Выкатка
        id: deploy
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
          IMAGE: ${{ steps.params.outputs.image }}
          CHART: ${{ steps.config.outputs.chart }}
          ROTATE: ${{ inputs.allow_key_rotation && '--allow-key-rotation' || '' }}
          HAMMURAPI_GITHUB_APP_ID: ${{ vars.HAMMURAPI_GITHUB_APP_ID }}
          HAMMURAPI_GITHUB_CLIENT_ID: ${{ vars.HAMMURAPI_GITHUB_CLIENT_ID }}
          HAMMURAPI_SPEC_REPO: ${{ vars.HAMMURAPI_SPEC_REPO }}
          HAMMURAPI_BOOTSTRAP_ADMINS: ${{ vars.HAMMURAPI_BOOTSTRAP_ADMINS }}
          HAMMURAPI_GITHUB_APP_PRIVATE_KEY: ${{ secrets.HAMMURAPI_GITHUB_APP_PRIVATE_KEY }}
          HAMMURAPI_GITHUB_CLIENT_SECRET: ${{ secrets.HAMMURAPI_GITHUB_CLIENT_SECRET }}
          HAMMURAPI_WEBHOOK_SECRET: ${{ secrets.HAMMURAPI_WEBHOOK_SECRET }}
          HAMMURAPI_TOKEN_ENCRYPTION_KEY: ${{ secrets.HAMMURAPI_TOKEN_ENCRYPTION_KEY }}
          # Необязательный: ключ DeepSeek для первого запуска; дальше подключения
          # к LLM настраиваются в «Администрирование → Агент» (FTR.HMR.CMN-0004).
          HAMMURAPI_BOOTSTRAP_DEEPSEEK_API_KEY: ${{ secrets.HAMMURAPI_BOOTSTRAP_DEEPSEEK_API_KEY }}
          HAMMURAPI_GHCR_PULL_TOKEN: ${{ secrets.HAMMURAPI_GHCR_PULL_TOKEN }}
        run: |
          source "$RUNNER_TEMP/hmr.sh"
          # Конфигурация и секреты — одним JSON в stdin SSH; jq берёт значения из
          # окружения ($ENV), а не из аргументов.
          if [[ $COMPONENT == hammurapi-core ]]; then
            payload=$(jq -cn '{
              image: $ENV.IMAGE,
              config: {GIT_PROVIDER: "github", GIT_REPO: $ENV.HAMMURAPI_SPEC_REPO,
                GITHUB_APP_ID: $ENV.HAMMURAPI_GITHUB_APP_ID, GITHUB_CLIENT_ID: $ENV.HAMMURAPI_GITHUB_CLIENT_ID,
                BOOTSTRAP_ADMINS: $ENV.HAMMURAPI_BOOTSTRAP_ADMINS},
              secrets: ({GITHUB_APP_PRIVATE_KEY: $ENV.HAMMURAPI_GITHUB_APP_PRIVATE_KEY,
                GITHUB_CLIENT_SECRET: $ENV.HAMMURAPI_GITHUB_CLIENT_SECRET, WEBHOOK_SECRET: $ENV.HAMMURAPI_WEBHOOK_SECRET,
                TOKEN_ENCRYPTION_KEY: $ENV.HAMMURAPI_TOKEN_ENCRYPTION_KEY}
                + (if ($ENV.HAMMURAPI_BOOTSTRAP_DEEPSEEK_API_KEY // "") != ""
                   then {BOOTSTRAP_DEEPSEEK_API_KEY: $ENV.HAMMURAPI_BOOTSTRAP_DEEPSEEK_API_KEY} else {} end)),
              ghcrPullToken: $ENV.HAMMURAPI_GHCR_PULL_TOKEN}')
          else
            payload=$(jq -cn '{image: $ENV.IMAGE, ghcrPullToken: $ENV.HAMMURAPI_GHCR_PULL_TOKEN}')
          fi
          set +e
          # shellcheck disable=SC2086
          printf '%s' "$payload" | remote "bash $PROD_DIR/current/bin/hammurapi-deploy $COMPONENT $TAG $CHART $ROTATE" | tee deploy.log
          rc=${PIPESTATUS[1]}
          set -e
          result=$(tail -n 1 deploy.log)
          if jq -e . >/dev/null 2>&1 <<<"$result"; then
            echo "result=$(jq -c . <<<"$result")" >>"$GITHUB_OUTPUT"
          fi
          if ((rc != 0)); then
            echo "::error::hammurapi-deploy завершился с кодом $rc: $(jq -r '.error // "см. журнал"' <<<"$result" 2>/dev/null)"
            exit "$rc"
          fi

      - name: Проверки после выкатки (через публичные домены)
        env:
          RESULT: ${{ steps.deploy.outputs.result }}
          WEBHOOK_SECRET: ${{ secrets.HAMMURAPI_WEBHOOK_SECRET }}
        run: |
          domain=$(jq -r .publicBaseDomain <<<"$RESULT")
          first=$(jq -r .firstInstall <<<"$RESULT")
          [[ -n $domain && $domain != null ]] || { echo "::error::нет домена в итоге выкатки"; exit 1; }
          api="https://api.$domain" web="https://web.$domain"
          # Поды могут стать готовыми раньше, чем Traefik подхватит маршруты.
          retry() { local _; for _ in $(seq 1 10); do "$@" && return 0; sleep 15; done; return 1; }
          check() { local name=$1; shift; if retry "$@"; then echo "✓ $name"; echo "- ✓ $name" >>"$GITHUB_STEP_SUMMARY"; else echo "::error::✗ $name"; echo "- ✗ $name" >>"$GITHUB_STEP_SUMMARY"; failed=1; fi; }
          failed=0
          echo "### Проверки $COMPONENT $TAG на $domain" >>"$GITHUB_STEP_SUMMARY"
          redirect() { [[ $(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 15 "http://$1/") =~ ^30[178]\ https:// ]]; }
          if [[ $COMPONENT == hammurapi-core ]]; then
            config_ok() { curl -fsS --max-time 15 "$api/api/v1/config" | jq -e '.provider == "github"' >/dev/null; }
            ping_ok() {
              local body sig
              body=$(jq -cn --arg z "Keep it logically awesome." '{zen: $z, hook_id: 0}')
              sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | sed 's/^.* //')
              [[ $(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X POST "$api/hooks/v1/git" \
                -H 'Content-Type: application/json' -H 'X-GitHub-Event: ping' -H "X-GitHub-Delivery: deploy-check-$GITHUB_RUN_ID" \
                -H "X-Hub-Signature-256: sha256=$sig" --data "$body") == 202 ]]
            }
            metrics_closed() { [[ $(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$api/metrics") != 200 ]]; }
            check "GET $api/api/v1/config — 200, provider github" config_ok
            check "подписанный ping на $api/hooks/v1/git — 202" ping_ok
            check "$api/metrics закрыт" metrics_closed
            check "http://api.$domain → HTTPS" redirect "api.$domain"
            if [[ $first == true ]]; then
              admins_ok() { curl -fsS --max-time 15 "$api/api/v1/config" | jq -e '.bootstrapAdminsConfigured == true' >/dev/null; }
              check "первая установка: первый глобальный администратор задан" admins_ok
            fi
          else
            page_ok() { [[ $(curl -sS -o /dev/null -w '%{http_code} %{content_type}' --max-time 15 "$web/") =~ ^200\ text/html ]]; }
            cfg_ok() { curl -fsS --max-time 15 "$web/config.json" | jq -e --arg a "$api" '.apiBaseUrl == $a' >/dev/null; }
            cors_ok() {
              curl -sS -D - -o /dev/null --max-time 15 -X OPTIONS "$api/api/v1/auth/me" -H "Origin: $web" \
                -H 'Access-Control-Request-Method: GET' | tr -d '\r' |
                grep -qi "^access-control-allow-origin: $web\$" &&
              curl -sS -D - -o /dev/null --max-time 15 -X OPTIONS "$api/api/v1/auth/me" -H "Origin: $web" \
                -H 'Access-Control-Request-Method: GET' | tr -d '\r' | grep -qi '^access-control-allow-credentials: true$'
            }
            check "GET $web/ — 200 text/html" page_ok
            check "$web/config.json: apiBaseUrl = $api" cfg_ok
            check "CORS $api с Origin $web" cors_ok
            check "http://web.$domain → HTTPS" redirect "web.$domain"
          fi
          exit "$failed"

      - name: Диагностика
        if: failure() && steps.deploy.outputs.result != ''
        env:
          RESULT: ${{ steps.deploy.outputs.result }}
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
        run: |
          source "$RUNNER_TEMP/hmr.sh"
          path=$(jq -r '.diagnostics // empty' <<<"$RESULT")
          [[ $path =~ ^/[A-Za-z0-9._/-]+\.tar\.gz$ ]] || { echo "диагностики нет"; exit 0; }
          remote "cat '$path'" >deploy-diagnostics.tar.gz || true
      - name: Артефакт диагностики
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-${{ inputs.component }}-${{ inputs.tag }}
          path: |
            deploy.log
            deploy-diagnostics.tar.gz
          if-no-files-found: ignore

      - name: Вебхук результата
        if: always() && inputs.callback_url != ''
        env:
          JOB_STATUS: ${{ job.status }}
          RESULT: ${{ steps.deploy.outputs.result }}
          CONFIG_ERROR: ${{ steps.config.outputs.error }}
        run: |
          source "$RUNNER_TEMP/hmr.sh"
          if [[ $JOB_STATUS == success ]]; then
            send_callback success
          else
            err=$(jq -r '.error // empty' <<<"${RESULT:-{\}}" 2>/dev/null || true)
            send_callback failure "${err:-${CONFIG_ERROR:-выкатка не выполнена, см. $RUN_URL}}"
          fi

# Hammurapi — local environment (arch spec §18).
#
#   cp .env.example .env         # or run install/install.sh
#   docker compose up -d --build
#   open http://localhost:8080
#
# Expects hammurapi-core and hammurapi-web checked out next to this repository.
# The git provider is external (GitHub or GitLab). For a demo without one, start
# the "demo" profile: an in-memory fake GitLab and a scripted LLM (fakellm) for
# the agent (development only):
#
#   docker compose --profile demo up -d --build
#
# The cleaner runs on demand: docker compose run --rm api cleaner
#
# The agent (HMR.CMN-0004) is the operator service "agent": a Pi process per chat
# or task session, from the release image of hammurapi-core. LLM connections and
# models are set in Admin → Agent; BOOTSTRAP_DEEPSEEK_API_KEY creates the first one.
#
# Agent tasks (code generation, reverts) run with RUNNER_EXECUTOR=local as
# subprocesses of the worker, in the runner-work volume — for development and
# demos only; production uses the k8s executor (a Job per task). Pi's file and
# shell tools reach the task's working copy over its workspace server.
#
# Metric sources for Discovery: docker compose --profile metrics up -d starts ClickHouse.

name: hammurapi

x-hammurapi: &hammurapi
  env_file: .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      {
        POSTGRES_DB: hammurapi,
        POSTGRES_USER: hammurapi,
        POSTGRES_PASSWORD: hammurapi,
      }
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U hammurapi"],
        interval: 5s,
        retries: 10,
      }

  # bitnami/kafka is no longer published; the official Apache image runs KRaft.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      retries: 12

  # minio/minio is no longer published on Docker Hub; Chainguard ships the same server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      { MINIO_ROOT_USER: hammurapi, MINIO_ROOT_PASSWORD: hammurapi123 }
    user: "0"
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment: { ASR_MODEL: small, ASR_ENGINE: openai_whisper }
    ports: ["9091:9000"]
    profiles: ["voice"]

  migrate:
    <<: *hammurapi
    build: { context: ../hammurapi-core }
    image: hammurapi:local
    command: ["migrate"]
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *hammurapi
    image: hammurapi:local
    command: ["api"]
    environment:
      # Internal API (:8081): the chat's MCP endpoint and the runner task API.
      INTERNAL_ADDR: ":8081"
      INTERNAL_URL: http://api:8081
      AGENT_ADDR: http://agent:8090
    ports: ["8090:8080", "9100:9100"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      minio: { condition: service_started }
      agent: { condition: service_started }

  # Workflows, webhooks, imports, agent scenarios (Analysis, gate generation,
  # checks) through the operator, the MCP of task sessions (:8083) and runner tasks.
  worker:
    <<: *hammurapi
    image: hammurapi:local
    command: ["worker"]
    environment:
      INTERNAL_URL: http://api:8081
      AGENT_ADDR: http://agent:8090
      AGENT_RUNNER_URL: http://agent:8090
      WORKER_MCP_URL: http://worker:8083
      RUNNER_EXECUTOR: local
      RUNNER_WORKDIR: /var/lib/hammurapi/runs
      RUNNER_MAX_PARALLEL: "2"
      # The operator reaches the workspace server of a local runner task here.
      RUNNER_WORKSPACE_HOST: worker
    volumes: ["runner-work:/var/lib/hammurapi/runs"]
    ports: ["9101:9100"]
    depends_on:
      api: { condition: service_started }
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      minio: { condition: service_started }

  # The agent operator (mode agent): Pi and the hammurapi-workspace extension are
  # in the release image. It gets only its token: keys arrive with each session.
  agent:
    build:
      context: ../hammurapi-core
      target: release
      args: { PI_VERSION: "${PI_VERSION:-1.0.0}" }
    image: hammurapi-core:local
    command: ["agent"]
    environment:
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?set AGENT_SERVICE_TOKEN in .env}
      AGENT_IDLE_TIMEOUT: ${AGENT_IDLE_TIMEOUT:-15m}
    volumes: ["agent-work:/work"]
    ports: ["9102:9100"]
    restart: unless-stopped

  # Metric sources for Discovery (read-only account "metrics", database "metrics").
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["metrics"]
    environment:
      {
        CLICKHOUSE_USER: metrics,
        CLICKHOUSE_PASSWORD: metrics,
        CLICKHOUSE_DB: metrics,
      }
    ports: ["8123:8123"]
    volumes: ["clickhouse-data:/var/lib/clickhouse"]

  # The SPA and a reverse proxy to api: one origin for cookies (PUBLIC_URL).
  web:
    build: { context: ../hammurapi-web }
    image: hammurapi-web:local
    environment: { API_UPSTREAM: "api:8080" }
    ports: ["8080:8080"]
    restart: unless-stopped
    depends_on: [api]

  # Development only: in-memory GitLab imitation — the specification repository,
  # service repositories, MRs, CI results, pipelines, tags and webhooks.
  fakegitlab:
    build: { context: ../hammurapi-core, target: fakegitlab }
    image: hammurapi-fakegitlab:local
    profiles: ["demo"]
    environment:
      FAKE_PUBLIC_URL: http://localhost:8929
      FAKE_WEBHOOK_URL: http://api:8080/hooks/v1/git
      FAKE_SPEC_REPO: ${GIT_REPO:-demo/specs}
      FAKE_SEED_DIR: /seed/rules
      FAKE_SERVICE_REPOS: "demo/booking=FMS/CAR,demo/pricing=FMS/CAR"
      FAKE_USERS: "admin:Admin,anna:Anna K.,oleg:Oleg D."
      FAKE_GROUPS: "team-fleet:anna;oleg"
      FAKE_BOT_TOKEN: ${GITLAB_BOT_TOKEN:-}
      FAKE_CI_SECRET: ${CI_RESULTS_SECRET:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    env_file: .env
    volumes: ["./rules:/seed/rules:ro"]
    ports: ["8929:8929"]

  # Development only: a scripted OpenAI-compatible LLM for the agent (Analysis,
  # tech/qa generation, code generation, checks; the chat echoes). With
  # BOOTSTRAP_DEEPSEEK_BASE_URL=http://fakellm:8099 the first connection uses it.
  fakellm:
    build: { context: ../hammurapi-core, target: fakellm }
    image: hammurapi-fakellm:local
    profiles: ["demo"]
    environment: { FAKELLM_ADDR: ":8099" }
    ports: ["8099:8099"]

volumes:
  {
    postgres-data: {},
    kafka-data: {},
    minio-data: {},
    runner-work: {},
    agent-work: {},
    clickhouse-data: {},
  }

# Instance image = Hammurapi + ACP agent (see Dockerfile.instance). Used by api.
image: { repository: registry.example.com/hammurapi, tag: "1.0.0", pullPolicy: IfNotPresent }
# worker, cleaner and migrate do not need the agent; defaults to `image`.
coreImage: {}
web:
  enabled: true
  image: { repository: registry.example.com/hammurapi-web, tag: "1.0.0", pullPolicy: IfNotPresent }
  replicas: 2
  resources: { requests: { cpu: 50m, memory: 64Mi } }

imagePullSecrets: []

api:
  replicas: 2
  resources: { requests: { cpu: 200m, memory: 256Mi } }
  # Agent processes (ACP_MAX_PROCESSES) run inside the api pod: size limits for them.
  extraEnv: []
worker:
  replicas: 1
  resources: { requests: { cpu: 100m, memory: 128Mi } }
cleaner:
  schedule: "0 3 * * *"
  resources: { requests: { cpu: 50m, memory: 64Mi } }
migrate:
  resources: { requests: { cpu: 50m, memory: 64Mi } }

podSecurityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: [ALL] } }

service:
  type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: hammurapi.example.com
  tls: []            # - { secretName: hammurapi-tls, hosts: [hammurapi.example.com] }
  annotations: {}
  # Binds a user to one api pod by cookie: the ACP session and the SSE stream live there.
  stickySessions: true

probes:
  liveness:  { path: /healthz, port: 9100 }
  readiness: { path: /readyz,  port: 9100 }

# Non-secret configuration (ConfigMap). See docs/configuration.md.
config:
  PUBLIC_URL: https://hammurapi.example.com
  GIT_PROVIDER: gitlab
  GIT_BASE_URL: https://gitlab.com
  GIT_REPO: product/specs
  GIT_DEFAULT_BRANCH: main
  BOOTSTRAP_ADMINS: ""
  ACP_AGENT_COMMAND: claude-agent-acp
  ACP_AGENT_ARGS: ""
  ACP_MAX_PROCESSES: "4"
  ACP_SESSION_IDLE_TIMEOUT: 30m
  KAFKA_BROKERS: kafka:9092
  S3_ENDPOINT: minio:9000
  S3_BUCKET: hammurapi
  S3_USE_SSL: "false"
  WHISPER_URL: http://whisper:9000
  UPLOAD_MAX_BYTES: "20971520"
  IMPORT_MAX_BYTES: "52428800"
  IMPORT_MAX_UNCOMPRESSED_BYTES: "209715200"
  IMPORT_MAX_FILES: "500"
  LOG_LEVEL: info
  DEFAULT_LANGUAGE: en
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

# Secrets: reference an existing Secret (recommended) …
existingSecret: hammurapi-secrets
# … or let the chart create one from these values (existingSecret: "").
secrets: {}
  # DATABASE_URL: postgres://…
  # TOKEN_ENCRYPTION_KEY: <openssl rand -base64 32>
  # WEBHOOK_SECRET: …
  # GITLAB_CLIENT_ID / GITLAB_CLIENT_SECRET or GITHUB_APP_ID / GITHUB_APP_PRIVATE_KEY / GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET
  # S3_ACCESS_KEY / S3_SECRET_KEY
  # ACP_AGENT_ENV: ANTHROPIC_API_KEY=…

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

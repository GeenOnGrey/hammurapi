apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hammurapi.fullname" . }}-worker
  labels:
    {{- include "hammurapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "hammurapi.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "hammurapi.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "hammurapi.coreImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          ports:
            - { name: service, containerPort: 9100 }
          {{- include "hammurapi.envFrom" . | nindent 10 }}
          {{- include "hammurapi.probes" . | nindent 10 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}

{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hammurapi.fullname" . }}-web
  labels:
    {{- include "hammurapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "hammurapi.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "hammurapi.selector" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ printf "%s:%s" .Values.web.image.repository .Values.web.image.tag }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
            # The ingress routes API paths to api directly; the nginx proxy is a fallback.
            - name: API_UPSTREAM
              value: {{ printf "%s-api:8080" (include "hammurapi.fullname" .) | quote }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}

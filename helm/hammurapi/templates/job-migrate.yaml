# Migrations run before api/worker roll out (arch spec §17).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hammurapi.fullname" . }}-migrate
  labels:
    {{- include "hammurapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {{- include "hammurapi.selector" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "hammurapi.coreImage" . }}
          args: ["migrate"]
          # Pre-install hooks run before the chart ConfigMap exists; migrate needs only DATABASE_URL.
          envFrom:
            - secretRef: { name: {{ include "hammurapi.secretName" . }} }
          resources: {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}

{{- if eq .Values.runner.executor "k8s" }}
{{- $name := include "hammurapi.fullname" . }}
{{- $ns := .Values.runner.namespace }}
{{- if .Values.runner.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "hammurapi.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
---
{{- end }}
# The worker creates one Job per code task in the runner namespace (tech spec §runner).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-worker
  labels: {{- include "hammurapi.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-runner-jobs
  namespace: {{ $ns }}
  labels: {{- include "hammurapi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-runner-jobs
  namespace: {{ $ns }}
  labels: {{- include "hammurapi.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-runner-jobs
subjects:
  - kind: ServiceAccount
    name: {{ $name }}-worker
    namespace: {{ .Release.Namespace }}
{{- if .Values.runner.networkPolicy.enabled }}
---
# Runner pods accept connections only from the agent operator (workspace server)
# and reach only DNS, the internal API of Hammurapi (task description, git token,
# progress, result, MCP), the agent operator (the task's session) and the
# destinations listed in runner.networkPolicy.egress (git provider).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-runner
  namespace: {{ $ns }}
  labels: {{- include "hammurapi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: hammurapi-runner }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} }
          podSelector:
            matchLabels: {{- include "hammurapi.selector" (dict "root" . "component" "agent") | nindent 14 }}
      ports:
        - { port: {{ .Values.runner.workspacePort }}, protocol: TCP }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} }
          podSelector:
            matchLabels: {{- include "hammurapi.selector" (dict "root" . "component" "api") | nindent 14 }}
      ports:
        - { port: 8081, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} }
          podSelector:
            matchLabels: {{- include "hammurapi.selector" (dict "root" . "component" "agent") | nindent 14 }}
      ports:
        - { port: 8090, protocol: TCP }
    {{- with .Values.runner.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
